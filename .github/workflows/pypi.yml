name: PyPi

on:
  workflow_dispatch:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    uses: ./.github/workflows/test.yml
    permissions:
      actions: write
      contents: read
      pages: write
      id-token: write

  docs:
    name: Build documentation
    needs: [build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    outputs:
      artifact-name: ${{ env.PAGES_ARTIFACT_NAME }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7

      - name: Install dependencies
        run: python -m pip install --upgrade pip

      - name: Install
        run: pip install --verbose . --group docs

      - name: Build documentation
        run: |
          cd docs
          make html

      - name: Setup pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: "docs/build/html/"

  deploy-docs:
    name: Deploy documentation
    needs: [docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.docs.outputs.artifact-name }}

  upload_pypi:
    needs: [build-and-test, deploy-docs]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          merge-multiple: true
          path: dist

      - name: Generate artifact attestation for sdist and wheels
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"

      - uses: pypa/gh-action-pypi-publish@release/v1
